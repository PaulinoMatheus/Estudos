<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posicionamento</title>
    <style>
        body{
            height: 98vh;
            background-image: url(imagens/wallpaper005.jpg);
            background-position: center top;
            background-repeat: no-repeat;
            background-size: 100%;
        }
        div#titulo{
            font-family: Georgia, 'Times New Roman', Times, serif;
            justify-content: center;
            align-items: center;
            display: inline;
            margin: 50px 50px 200px 50px;
            text-align: center;
            height: auto;
            max-width: 800px;
            min-width: 250px;
            font-weight: normal;
        }
        div#texto{
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            justify-content: center;
            align-items: center;
            display: inline;
            text-align: center;
            max-width: 800px;
            min-width: 250px;
            height: auto;
        }
    </style>
</head>
<body>
    <div id="titulo">
    <h1 >Estou aprendendo a como utilizar imagens no desenvolvimento do meu site!</h1>
    </div>
    <div id="texto">
        <p>Como pode ver no topo do site, estou utilizando uma imagem para deixá-lo melhor estilizado.</p>
    </div>
</body>
</html>
