<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Basquete - ESC</title>

<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&display=swap" rel="stylesheet">

<style>
body {
  font-family: "Bebas Neue";
  background:#0a0014;
  color:white;
  padding:40px;
}
h1 { font-family:'Anton'; font-size:3rem; }

.players {
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(150px,1fr));
  gap:20px;
}

.player img { width:100%; border-radius:10px; }

.btn {
  margin-top:30px;
  padding:15px;
  background:#9333ea;
  border:none;
  color:white;
}
</style>
</head>

<body>

<h1>🏀 Basquete</h1>

<h2>Próximos Jogos</h2>
<p>ESC vs Time X - 22/04</p>

<div class="players">
  <div class="player">
    <img src="https://via.placeholder.com/150">
    <p>Atleta 1</p>
  </div>
</div>

<button class="btn">Quero Participar</button>

</body>
</html>
