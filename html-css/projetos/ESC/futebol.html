<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Futebol - ESC</title>

<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&display=swap" rel="stylesheet">

<style>
body {
  font-family: "Bebas Neue";
  background:#0a0014;
  color:white;
  padding:40px;
}

h1 {
  font-family:'Anton';
  font-size:3rem;
}

.players {
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(150px,1fr));
  gap:20px;
  margin-top:30px;
}

.player {
  text-align:center;
}

.player img {
  width:100%;
  border-radius:10px;
}

.btn {
  margin-top:30px;
  padding:15px;
  background:#9333ea;
  border:none;
  color:white;
}
</style>
</head>

<body>

<h1>⚽ Futebol</h1>

<h2>Próximos Jogos</h2>
<p>ESC vs Rival - 20/04</p>

<h2>Elenco</h2>

<div class="players">
  <div class="player">
    <img src="https://via.placeholder.com/150">
    <p>Jogador 1</p>
  </div>

  <div class="player">
    <img src="https://via.placeholder.com/150">
    <p>Jogador 2</p>
  </div>
</div>

<button class="btn">Quero Participar</button>

</body>
</html>
